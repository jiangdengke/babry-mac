<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 36 100 100" role="img" aria-label="Babry menu bar icon">
  <!-- 取自 babry-mark.svg 的图形，去掉彩色底。作为模板图使用，系统只看透明度。 -->
  <defs>
    <!-- 加号压在画框的角上，单色时会连成一片，所以在它周围留出空隙。 -->
    <mask id="around-plus" maskUnits="userSpaceOnUse" x="36" y="36" width="100" height="100">
      <rect x="36" y="36" width="100" height="100" fill="#fff"/>
      <path d="M111 111h20M121 101v20" stroke="#000" stroke-linecap="round" stroke-width="17"/>
    </mask>
  </defs>
  <g fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" mask="url(#around-plus)">
    <rect x="43" y="43" width="73" height="61" rx="9"/>
    <path d="M43 104 64 83l16 14 15-18 21 25"/>
  </g>
  <circle cx="99" cy="61" r="7.5" fill="#000"/>
  <path d="M111 111h20M121 101v20" fill="none" stroke="#000" stroke-linecap="round" stroke-width="7"/>
</svg>
