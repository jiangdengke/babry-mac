[package]
name = "babry-mac"
version = "0.1.0"
edition = "2024"
description = "Babry 的 macOS 移植：懂边界的截图工具"
license = "Apache-2.0"
repository = "https://github.com/jiangdengke/babry-mac"

[lib]
name = "babry"

[[bin]]
name = "babry"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
image = "0.25"
imageproc = "0.25"
slint = { version = "1.17", features = ["unstable-fontique-010", "unstable-winit-030"] }
tempfile = "3"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
slint-build = "1.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
